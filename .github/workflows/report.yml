name: report

# decomp.dev reads the objdiff report from a `<version>_report` artifact of a
# push run on main. CI can't build without the retail ELF, so this uploads the
# report that tools/progress.py --write commits to docs/progress/.
on:
  push:
    branches: [main]
    paths: [docs/progress/report.json]
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: us_report
          path: docs/progress/report.json
